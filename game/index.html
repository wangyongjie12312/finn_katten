<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3b2a20">
<title>Finn kattene</title>
<style>
:root{--bg:#FFF4E6;--card:#FFFFFF;--ink:#3b2a20;--muted:#8a7363;--line:#E8D5BF;--sel:#FFE9A8;--ok:#2E7D32;--warn:#C62828;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d1813;--card:#2a221b;--ink:#f6eadc;--muted:#bba692;--line:#433629;--sel:#5a4a1e;--ok:#81C784;--warn:#EF9A9A;}}
:root[data-theme="dark"]{--bg:#1d1813;--card:#2a221b;--ink:#f6eadc;--muted:#bba692;--line:#433629;--sel:#5a4a1e;--ok:#81C784;--warn:#EF9A9A;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
body{min-height:100vh;padding:16px;display:flex;justify-content:center}
.wrap{width:100%;max-width:1100px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
header .hb{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
h1{font-size:clamp(22px,3.4vw,32px);line-height:1.15}
h1 small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:3px}
h2.step{font-size:18px;margin:16px 0 8px}
.btn{border:3px solid #3b2a20;background:#FFD54F;color:#3b2a20;border-radius:14px;padding:10px 18px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 #3b2a20;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3b2a20}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.red{background:#EF6C5A;color:#fff}
.btn.big{font-size:20px;padding:16px 22px;width:100%}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:none;font-size:14px;padding:7px 12px}
.btn.small{font-size:14px;padding:6px 12px;box-shadow:0 3px 0 #3b2a20}
section{display:none}
section.on{display:block}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=text]{font:inherit;font-size:17px;padding:9px 12px;border:3px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);min-width:0}
input.code{text-transform:uppercase;letter-spacing:4px;width:140px;font-weight:800}
input[type=range]{width:180px;accent-color:#EF6C5A}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.err{color:var(--warn);font-weight:700;font-size:14px;line-height:1.5}
.link{color:#1E88E5;font-weight:700;word-break:break-all}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.card{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:6px 6px 8px;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px)}
.card.mine{border-color:#3b2a20;background:var(--sel)}
.card.taken{opacity:.55;cursor:not-allowed}
.card.out{opacity:.35;cursor:not-allowed;filter:grayscale(.8)}
.card canvas{width:100%;aspect-ratio:160/140;display:block}
.card b{display:block;font-size:16px}
.card span{display:block;font-size:12px;color:var(--muted);min-height:16px}
.roles{display:flex;gap:8px;flex-wrap:wrap}
.role{border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.role.on{border-color:#3b2a20;background:#FFD54F;color:#3b2a20}
.role:disabled{opacity:.4;cursor:not-allowed}
.chip{border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;min-width:40px}
.chip.on{border-color:#3b2a20;background:#FFD54F;color:#3b2a20}
.chip:disabled{opacity:.5;cursor:not-allowed}
.plist{list-style:none;display:grid;gap:6px}
.plist li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:var(--bg);font-size:15px}
.plist .dot{width:12px;height:12px;border-radius:50%;flex:none}
.plist .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .x{border:none;background:none;color:var(--muted);font-size:18px;cursor:pointer}
.status{font-weight:700;font-size:16px;margin:6px 0}
.status.ok{color:var(--ok)}.status.bad{color:var(--warn)}
.setting{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0;font-weight:700}
.stand{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px}
.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;border:3px solid #3b2a20;background:#F3E2C7;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.stage canvas{width:100%;height:100%;display:block;touch-action:none}
.ctrls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;user-select:none;-webkit-user-select:none}
.pad{display:flex;gap:10px;align-items:center}
.ctl{width:64px;height:64px;border-radius:50%;border:3px solid #3b2a20;background:var(--card);color:var(--ink);font-size:26px;font-weight:800;touch-action:none;cursor:pointer;box-shadow:0 4px 0 #3b2a20;font-family:inherit}
.ctl.big{width:76px;height:76px;background:#FFD54F;color:#3b2a20}
.ctl.gear{width:48px;height:48px;font-size:22px}
.ctl.on{transform:translateY(3px);box-shadow:0 1px 0 #3b2a20}
.hint{font-size:13px;color:var(--muted);text-align:center;flex:1}
.ranklist{list-style:none;display:grid;gap:6px}
.ranklist li{display:flex;align-items:center;gap:12px;font-size:16px;padding:6px 10px;border-radius:10px;background:var(--bg)}
.ranklist .pl{font-weight:800;min-width:96px}
.ranklist .nm{flex:1;font-weight:700}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0 8px}
.rules{font-size:14px;line-height:1.75}
.modal{position:fixed;inset:0;background:rgba(30,18,10,.55);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:50;overflow:auto}
.modal.on{display:flex}
.mpanel{background:var(--card);color:var(--ink);border:3px solid #3b2a20;border-radius:20px;padding:18px 20px;width:100%;max-width:560px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.mpanel h2{font-size:22px;margin-bottom:8px}
.mpanel h3{font-size:15px;margin:14px 0 4px;color:var(--muted)}
.confirm{background:var(--bg);border:2px dashed #EF6C5A;border-radius:14px;padding:12px;margin-top:12px}
footer{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}
@media (max-width:600px){body{padding:10px}.ctl{width:58px;height:58px}.ctl.big{width:68px;height:68px}.hint{display:none}}

html{touch-action:manipulation;-webkit-text-size-adjust:100%}
#play,.ctl,.dpad{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.dpad{display:flex;gap:10px;align-items:center;touch-action:none;padding:6px;margin:-6px;border-radius:44px}
.ctl svg{display:block;margin:auto}
.btn.ghost.fsb{display:inline-flex;align-items:center;gap:6px}
.rotTip{display:none}
@media (pointer:coarse){.ctl{width:78px;height:78px;font-size:32px}.ctl.big{width:92px;height:92px;font-size:36px}.ctl.gear{width:54px;height:54px}.dpad{gap:14px}}
@media (pointer:coarse) and (max-width:600px){.ctl{width:70px;height:70px}.ctl.big{width:82px;height:82px}.ctl.gear{width:48px;height:48px}}
/* fullskjerm (ekte eller «pseudo» for iPhone) */
@media (max-width:600px){.ctrls{flex-wrap:wrap;row-gap:12px}.ctrls .util{order:3;width:100%;justify-content:center}.ctrls .hint{display:none}.fsb span{display:none}}

.mpanel.wide{max-width:760px}
.galTop{display:flex;align-items:center;gap:8px}
.galTitle{flex:1;text-align:center;min-width:0}.galTitle b{display:block;font-size:21px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.galImg{margin:10px 0;background:var(--bg);border-radius:14px;display:flex;justify-content:center;align-items:center;min-height:220px;border:2px solid var(--line);padding:8px}
.galImg img{max-width:100%;max-height:min(56vh,560px);display:block;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.likeBtn{background:var(--card);color:#C62828;font-size:18px}
.likeBtn.on{background:#FFCDD2}
.coms{list-style:none;display:grid;gap:5px;margin:8px 0 10px}
.coms li{display:flex;align-items:center;gap:6px;font-size:15px;padding:6px 10px;border-radius:10px;background:var(--bg)}
.coms li.none{color:var(--muted)}
.coms .dot{width:12px;height:12px;border-radius:50%;flex:none;border:1.5px solid #3b2a20}
.phr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#teamCv,#teamImg{width:100%;height:auto;display:block;border-radius:12px}
@media (orientation:landscape) and (max-height:560px){.modal{padding:8px}.mpanel{padding:12px 16px}#galBody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 14px;align-items:start}#galBody .galImg{grid-row:1 / span 3;margin:6px 0 0;min-height:0}#galBody .galImg img{max-height:calc(100vh - 150px)}.galTitle b{font-size:18px}.mpanel .actions{margin:8px 0 0}}
.startBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
body.fs{overflow:hidden}
body.fs #play.on{position:fixed;inset:0;z-index:40;background:#120c08;display:flex;align-items:center;justify-content:center;touch-action:none}
body.fs #play .stage{width:min(100vw,calc(100vh*16/9));width:min(100vw,calc(100dvh*16/9));height:auto;border:0;border-radius:0;box-shadow:none}
body.fs #play .ctrls{position:absolute;left:0;right:0;bottom:0;margin:0;padding:10px max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));pointer-events:none;align-items:flex-end}
body.fs #play .ctrls .pad,body.fs #play .ctrls .dpad,body.fs #play .ctrls button{pointer-events:auto}
body.fs #play .ctl{background:rgba(255,255,255,.42);border-color:rgba(59,42,32,.7);box-shadow:0 3px 0 rgba(59,42,32,.7);color:#3b2a20}
body.fs #play .ctl.big{background:rgba(255,213,79,.78)}
body.fs #play .ctl.on{background:rgba(255,255,255,.75)}
body.fs #play .hint{display:none}
body.fs #play .rotTip{position:absolute;top:max(8px,env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:14px;opacity:.8}
@media (orientation:portrait){body.fs #play .rotTip{display:block}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Finn kattene 🐱🌺<small data-i18n="sub"></small></h1>
    <div class="hb"><button class="btn ghost fsb" id="fsTop"></button><button class="btn ghost" id="setBtn" data-i18n="settings"></button><button class="btn ghost" id="muteBtn"></button></div>
  </header>

  <!-- START -->
  <section id="start" class="on">
    <div class="panel">
      <div class="row"><b data-i18n="yourName"></b><input type="text" id="nick" maxlength="16" data-i18n-ph="namePh"></div>
    </div>
    <div class="two">
      <div class="panel">
        <h2 class="step" style="margin-top:0" data-i18n="soloH"></h2>
        <p class="note" data-i18n="soloNote"></p>
        <div style="margin-top:10px"><button class="btn big" id="soloBtn" data-i18n="soloBtn"></button></div>
      </div>
      <div class="panel">
        <h2 class="step" style="margin-top:0" data-i18n="onlineH"></h2>
        <div id="roomBox" style="display:none">
          <p class="note" data-i18n="roomNoteOk"></p>
          <div style="margin-top:10px"><button class="btn big red" id="roomBtn" data-i18n="roomBtn"></button></div>
        </div>
        <p class="err" id="roomNote" style="display:none" data-i18n="roomNoteBad"></p>
        <div id="codeBox" style="margin-top:10px">
          <p class="note"><b data-i18n="codeHead"></b> <span data-i18n="codeNote"></span></p>
          <div id="rtcBox">
            <div class="row" style="margin-top:10px"><button class="btn red" id="createBtn" data-i18n="createBtn"></button></div>
            <div class="row" style="margin-top:10px"><input type="text" class="code" id="codeIn" maxlength="4" data-i18n-ph="codePh"><button class="btn" id="joinBtn" data-i18n="joinBtn"></button></div>
          </div>
          <p class="err" id="noRtc" style="display:none"><span data-i18n="noRtc"></span><br><a class="link" id="pagesLink" target="_blank" rel="noopener"></a></p>
          <div class="err" id="netErr"></div>
        </div>
        <div style="margin-top:10px"><button class="btn ghost" id="localBtn" data-i18n="localBtn"></button></div>
      </div>
    </div>
    <div class="startBtns"><button class="btn" id="studioBtn" data-i18n="studioBtn"></button><button class="btn ghost" id="aboutBtn" data-i18n="aboutBtn"></button></div>
    <div class="panel rules" data-i18n-html="rules"></div>
  </section>

  <!-- LOBBY -->
  <section id="lobby">
    <div class="panel"><div class="row" style="justify-content:space-between"><div><b id="lobMode"></b><div class="note" id="lobSub"></div></div><button class="btn ghost" id="leaveBtn" data-i18n="leave"></button></div></div>
    <div id="noHost" class="panel" style="display:none"><p class="status" data-i18n="noHost"></p><button class="btn red" id="makeHostBtn" data-i18n="makeHost"></button></div>
    <div id="lobMain">
      <div class="panel" id="lastBox" style="display:none"></div>
      <h2 class="step" data-i18n="step1"></h2>
      <div class="grid" id="catGrid"></div>
      <div class="row" style="margin-top:10px"><b data-i18n="catNameLbl"></b><input type="text" id="catName" maxlength="12" data-i18n-ph="catNamePh"></div>
      <h2 class="step" data-i18n="step2"></h2>
      <div class="roles" id="roleRow">
        <button class="role" data-r="h" data-i18n="roleH"></button>
        <button class="role" data-r="s" data-i18n="roleS"></button>
        <button class="role" data-r="o" data-i18n="roleO"></button>
      </div>
      <div class="two">
        <div class="panel"><h2 class="step" style="margin-top:0" data-i18n="players"></h2><ul class="plist" id="plist"></ul><div class="status" id="teamStatus"></div></div>
        <div class="panel" id="hostPanel">
          <h2 class="step" style="margin-top:0"><span data-i18n="settingsH"></span> <small id="hostOnly" class="note"></small></h2>
          <div class="setting"><span data-i18n="bots"></span> <button class="btn small" id="botH" data-i18n="botH"></button><button class="btn small" id="botS" data-i18n="botS"></button><button class="btn small" id="botBal" data-i18n="botBal"></button></div>
          <div class="setting" id="roundSet"></div>
          <div class="setting" id="minSet"></div>
          <div class="setting" id="hintSet"></div>
          <div class="setting" id="dogSet"></div>
          <div class="setting" id="fishSet"></div>
          <div style="margin-top:12px"><button class="btn red big" id="startRoundBtn"></button></div>
        </div>
      </div>
      <div class="panel" id="standBox" style="display:none"><h2 class="step" style="margin-top:0" data-i18n="standings"></h2><div class="stand" id="stand"></div></div>
    </div>
  </section>

  <!-- SPILL -->
  <section id="play">
    <div class="stage"><canvas id="game"></canvas></div>
    <div class="rotTip" data-i18n="rotTip"></div>
    <div class="ctrls">
      <div class="dpad" id="dpad">
        <button class="ctl" data-dir="left" aria-label="←">◀</button>
        <button class="ctl" data-dir="right" aria-label="→">▶</button>
      </div>
      <div class="hint" id="playHint" data-i18n="ctrlHint"></div>
      <div class="pad util">
        <button class="ctl gear" id="fsBtn" aria-label="⛶"></button>
        <button class="ctl gear" id="gearBtn" aria-label="⚙">⚙</button>
      </div>
      <div class="pad">
        <button class="ctl" data-k="jump" aria-label="↑">⤒</button>
        <button class="ctl big" data-k="search" aria-label="🔍">🔍</button>
      </div>
    </div>
  </section>

  <!-- PREMIEUTDELING -->
  <section id="awards">
    <div class="stage"><canvas id="award"></canvas></div>
    <div class="panel"><h2 class="step" style="margin-top:0" data-i18n="results"></h2><ol class="ranklist" id="rankList"></ol></div>
    <div class="actions"><button class="btn red" id="newBtn" data-i18n="newGame"></button><span class="note" id="awardWait"></span></div>
  </section>

  <footer data-i18n="footer"></footer>
</div>

<!-- INNSTILLINGER -->
<div class="modal" id="setModal">
  <div class="mpanel">
    <h2 data-i18n="setTitle"></h2>
    <div class="setting" id="langSet"></div>
    <div class="setting"><span data-i18n="sfx"></span><input type="range" id="sfxR" min="0" max="100"></div>
    <div class="setting"><span data-i18n="song"></span><input type="range" id="voxR" min="0" max="100"></div>
    <div class="setting" id="setCatRow"><span data-i18n="myCatName"></span><input type="text" id="setCatName" maxlength="12" data-i18n-ph="catNamePh"></div>
    <div id="hostLive" style="display:none">
      <h3 data-i18n="hostLive"></h3>
      <div class="setting" id="liveHint"></div>
      <div class="setting" id="liveDogs"></div>
      <div class="setting" id="livePause"><button class="btn small" id="pauseBtn"></button></div>
    </div>
    <div class="actions">
      <button class="btn red" id="exitBtn" data-i18n="exitGame"></button>
      <button class="btn" id="closeSet" data-i18n="close"></button>
    </div>
    <div class="confirm" id="exitBox" style="display:none">
      <p data-i18n="exitConfirm"></p><p class="err" id="exitHost" style="display:none" data-i18n="exitHostWarn"></p>
      <div class="actions"><button class="btn red" id="exitYes" data-i18n="yes"></button><button class="btn ghost" id="exitNo" data-i18n="no"></button></div>
    </div>
  </div>
</div>

<!-- ISABELLA'S STUDIO -->
<div class="modal" id="galModal">
  <div class="mpanel wide">
    <div class="galTop"><button class="btn small" id="galPrev" aria-label="◀">◀</button><div class="galTitle"><b id="galTitle">Isabella's Studio</b><span class="note" id="galMeta"></span></div><button class="btn small" id="galNext" aria-label="▶">▶</button></div>
    <div id="galBody">
      <div class="galImg"><img id="galImg" alt=""></div>
      <div class="row"><button class="btn likeBtn" id="likeBtn">❤ <span id="likeN">0</span></button><b data-i18n="comH"></b></div>
      <ul class="coms" id="coms"></ul>
      <div class="phr" id="phr"></div>
    </div>
    <p class="err" id="galOff" style="display:none"></p>
    <div class="actions"><button class="btn" id="galClose" data-i18n="close"></button></div>
  </div>
</div>
<div class="modal" id="infoModal">
  <div class="mpanel wide">
    <h2 data-i18n="aboutTitle"></h2>
    <p class="rules" data-i18n-html="aboutText"></p>
    <h3 data-i18n="teamH"></h3>
    <canvas id="teamCv" width="1440" height="860"></canvas><img id="teamImg" alt="" style="display:none">
    <div class="rules" data-i18n-html="rules"></div>
    <div class="actions"><button class="btn" id="infoClose" data-i18n="close"></button></div>
  </div>
</div>

<script>


/* ================= Verden ================= */
const VW=960,VH=540,W=3900,H=1620,F0=470,F1=1010,F2=1550,FLOOR=470,HOUSE=2700,G=2000,JUMP=-860;
const HIDE_T=10,START_FLOWERS=3,OUT='#3b2a20',FONT='"Trebuchet MS","Segoe UI",system-ui,sans-serif';
/* Trapp (loft ↔ 1. etasje) og stige (1. etasje ↔ kjeller) */
const LINKS=[
 {a:0,b:1,top:{x:1190,y:F0},bot:{x:1460,y:F1},zt:50,zb:40,dur:1.2},
 {a:1,b:2,top:{x:1065,y:F1},bot:{x:1065,y:F2},zt:36,zb:36,dur:1.1},
 {a:0,b:1,top:{x:2076,y:F0},bot:{x:2076,y:F1},zt:30,zb:30,dur:1.3},
 {a:1,b:2,top:{x:2342,y:F1},bot:{x:2342,y:F2},zt:30,zb:30,dur:1.1},
];
const STAIR={bx:LINKS[0].bot.x,by:LINKS[0].bot.y,tx:LINKS[0].top.x,ty:LINKS[0].top.y};

/* ---------- visning og interaksjon (DOM) ---------- */
let galOpen=false,infoOpen=false,galIdx=0,galSig='',galFromGame=false,lastComT=0;
const likedSet=new Set();
function anyModal(){return setOpen||galOpen||infoOpen;}
function galCanAct(){return galFromGame&&!!Lp&&!!GS&&(GS.ph==='hide'||GS.ph==='seek'||GS.ph==='over')&&!(GS.fd&&GS.fd[Lp.cat]);}
function openGallery(i,fromGame){if(!GAL.ok&&!GAL.items.length){galIdx=0;}galIdx=i||0;galFromGame=!!fromGame;galOpen=true;galSig='';for(const k in keys)keys[k]=false;
  document.getElementById('galModal').classList.add('on');renderGallery();}
function closeGallery(){galOpen=false;document.getElementById('galModal').classList.remove('on');}
function openInfo(){infoOpen=true;for(const k in keys)keys[k]=false;document.getElementById('infoModal').classList.add('on');renderInfo();}
function closeInfo(){infoOpen=false;document.getElementById('infoModal').classList.remove('on');}
function comText(code){const p=code&15,cat=code>>4;return{cat,txt:(t('phr')[p]||'…')};}
function renderGallery(){
  const n=GAL.items.length,box=document.getElementById('galBody'),off=document.getElementById('galOff');
  if(!n){box.style.display='none';off.style.display='';off.textContent=t('galOffline');return;}
  box.style.display='';off.style.display='none';galIdx=((galIdx%n)+n)%n;const it=GAL.items[galIdx];
  const sig=[LANG,galIdx,galLikes(galIdx),galComs(galIdx).join(','),likedSet.has(it.id),galCanAct()].join('|');if(sig===galSig)return;galSig=sig;
  document.getElementById('galTitle').textContent='«'+galTitle(galIdx)+'»';
  document.getElementById('galMeta').textContent=[t('galBy'),it.date?it.date.slice(0,4):'',t('galOf',galIdx+1,n)].filter(Boolean).join(' · ');
  const img=document.getElementById('galImg');const src='gallery/'+it.file;if(img.getAttribute('src')!==src){img.src=src;img.alt=galTitle(galIdx);}
  const lb=document.getElementById('likeBtn'),liked=likedSet.has(it.id),can=galCanAct();
  lb.classList.toggle('on',liked);lb.disabled=!can;document.getElementById('likeN').textContent=String(galLikes(galIdx));
  const ul=document.getElementById('coms');ul.innerHTML='';const cs=galComs(galIdx).slice().reverse();
  if(!cs.length){const li=document.createElement('li');li.className='none';li.textContent=t('comNone');ul.append(li);}
  for(const code of cs){const{cat,txt}=comText(code);const li=document.createElement('li');const dot=document.createElement('span');dot.className='dot';dot.style.background=(CATS[cat]||CATS[0]).fur;
    const b=document.createElement('b');b.textContent=(CATS[cat]?catName(cat):'?')+': ';const s=document.createElement('span');s.textContent=txt;li.append(dot,b,s);ul.append(li);}
  const ph=document.getElementById('phr');ph.innerHTML='';
  if(can){const lab=document.createElement('span');lab.className='note';lab.textContent=t('comPick');ph.append(lab);
    t('phr').forEach((p,k)=>{const b=document.createElement('button');b.className='chip';b.textContent=p;b.onclick=()=>galComment(k);ph.append(b);});}
  else{const lab=document.createElement('span');lab.className='note';lab.textContent=t('galOnlyGame');ph.append(lab);}
}
function galLike(){if(!galCanAct())return;const it=GAL.items[galIdx];if(!it)return;const on=!likedSet.has(it.id);if(on)likedSet.add(it.id);else likedSet.delete(it.id);store.set('liked',[...likedSet]);
  sendAct('like',galIdx*2+(on?1:0));if(on){tone(880,.1,'triangle',.1);tone(1320,.16,'triangle',.1,.08);}galSig='';renderGallery();}
function galComment(k){if(!galCanAct())return;const now=performance.now();if(now-lastComT<1200)return;lastComT=now;sendAct('com',galIdx*16+k);tone(660,.08,'sine',.08);tone(990,.12,'sine',.08,.07);}
function renderInfo(){
  const cv=document.getElementById('teamCv'),img=document.getElementById('teamImg');
  if(GAL.team&&GAL.team.file){cv.style.display='none';img.style.display='';const src='gallery/'+GAL.team.file;if(img.getAttribute('src')!==src)img.src=src;}
  else{cv.style.display='';img.style.display='none';}
}
function drawInfoCanvas(){if(!infoOpen)return;const cv=document.getElementById('teamCv');if(cv.style.display==='none')return;const c=cv.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);
  drawTeamPhoto(c,8,8,cv.width-16,cv.height-16,T,true);}

function meowCat(i,vol){if(muted)return;const a=ac();if(!a)return;const p=MEOW[i]||MEOW[0];vol=Math.max(.0001,(vol||.08)*SFXV);
  for(let r=0;r<(p.rep||1);r++){const t0=a.currentTime+r*(p.d+.06);
    const mk=(mult,v)=>{const o=a.createOscillator(),g=a.createGain();o.type=mult>1?'sine':p.w;const n=p.f.length;o.frequency.setValueAtTime(p.f[0]*mult,t0);
      for(let k=1;k<n;k++)o.frequency.exponentialRampToValueAtTime(p.f[k]*mult,t0+p.d*k/(n-1));
      if(p.vib){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=p.vib;lg.gain.value=p.vd*mult;l.connect(lg);lg.connect(o.frequency);l.start(t0);l.stop(t0+p.d+.05);}
      let out=o;if(p.lp){const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=p.lp;o.connect(f);out=f;}
      g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.04);g.gain.setValueAtTime(v,t0+p.d*.6);g.gain.exponentialRampToValueAtTime(.0001,t0+p.d);
      out.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+p.d+.05);};
    mk(1,vol);if(p.harm)mk(2,vol*.3);}}

const Net={kind:null,myId:'me',peers:new Map(),me:{},send:()=>{},code:'',error:''};

function netSet(patch){for(const k in patch){if(patch[k]==null)delete Net.me[k];else Net.me[k]=patch[k];}netDirty=true;}

function everyone(){const out=[];let mine=false;for(const e of Net.peers.values()){if(e.isMe||e.id===Net.myId){if(!mine){mine=true;out.push({id:Net.myId,isMe:true,p:Net.me});}}else out.push(e);}

  const conn=peer.connect('finnkattene-'+code.toLowerCase());

function linkStep(lv,to,x,tx){const up=to<lv;let best=null,bd=1e9;for(const L of LINKS){if(up?L.b!==lv:L.a!==lv)continue;const s=up?L.bot.x:L.top.x,e=up?L.top.x:L.bot.x;const d=(x==null?0:Math.abs(x-s))+(tx==null?0:Math.abs(e-tx));if(d<bd){bd=d;best=L;}}return{L:best,up};}
function planRoute(lv,tx,tlv,fx){const r=[];while(lv!==tlv){const{L,up}=linkStep(lv,tlv,fx,tx);fx=up?L.top.x:L.bot.x;r.push({k:'walk',x:up?L.bot.x:L.top.x});r.push({k:'climb',L,up});lv=up?L.a:L.b;}r.push({k:'walk',x:tx});return r;}
function routeInfo(x,lv,sp){let d=0,n=0;while(lv!==sp.lv){const{L,up}=linkStep(lv,sp.lv,x,sp.cx);d+=Math.abs((up?L.bot.x:L.top.x)-x);x=up?L.top.x:L.bot.x;lv=up?L.a:L.b;n++;}return{d:d+Math.abs(sp.cx-x),n};}
function startTween(e,tx,ty,dur,ht,kind){e.tw={fx:e.x,fy:e.y,tx,ty,dur,el:0,ht,kind};if(Math.abs(tx-e.x)>3)e.face=tx>e.x?1:-1;}
function walkTo(e,x,speed,dt){const dx=x-e.x;if(Math.abs(dx)<2){e.x=x;return true;}e.face=dx>=0?1:-1;e.x+=Math.sign(dx)*Math.min(Math.abs(dx),speed*dt);e.move=1;return false;}
function climbTween(e,L,up){e.climbTo=up?L.a:L.b;const t=up?L.top:L.bot;startTween(e,t.x,t.y,.9,0,'climb');}
function stepWalk(e,dt){const st=e.route[0];if(!st)return true;e.y=floorY(e.lv);
  if(st.k==='walk'){if(walkTo(e,st.x,e.speed,dt))e.route.shift();}else if(st.k==='climb'){e.route.shift();climbTween(e,st.L,st.up);}return false;}
function tweenStep(e,dt){const w=e.tw;w.el+=dt;const k=Math.min(1,w.el/w.dur);e.x=lerp(w.fx,w.tx,k);e.y=lerp(w.fy,w.ty,k)-w.ht*4*k*(1-k);if(w.kind==='climb')e.move=1;
  if(k>=1){e.tw=null;if(w.kind==='climb')e.lv=e.climbTo;return w.kind;}return null;}
function followStep(e,dt,tgt,rank){
  if(!tgt)return;const tl=tgt.lv!=null?tgt.lv:levelOf(tgt.x,tgt.y);
  if(tl!==e.lv){const{L,up}=linkStep(e.lv,tl,e.x,tgt.x);if(walkTo(e,up?L.bot.x:L.top.x,420,dt))climbTween(e,L,up);e.y=floorY(e.lv);return;}
  const tx=clamp(tgt.x-(tgt.face||1)*(62+rank*46),30,e.lv===1?W-30:HOUSE-24),dx=tx-e.x;
  if(Math.abs(dx)>8)walkTo(e,tx,Math.abs(dx)>220?440:290,dt);else e.face=tgt.face||1;e.y=floorY(e.lv);
}
function spotNear(x,y){let best=null,bd=1e9;for(const sp of SPOTS){if(x>=sp.zone[0]&&x<=sp.zone[1]&&y>=sp.yr[0]&&y<=sp.yr[1]){const d=Math.abs(sp.cx-x);if(d<bd){bd=d;best=sp;}}}return best;}
function randSpawn(){const r=Math.random(),lv=r<.33?0:r<.75?1:2,[a,b]=LVX[lv];let x=a;
  for(let k=0;k<20;k++){x=rnd(a,b);if(CLIMBS.every(L=>Math.abs(x-L.top.x)>70&&Math.abs(x-L.bot.x)>70)&&Math.abs(x-HOUSE)>90)break;}return{x:Math.round(x),lv};}

let lastTS=0,awardList=null;
function frame(ts){
  const dt=Math.min(.05,(ts-lastTS)/1000||0);lastTS=ts;T+=dt;
  if(Net.kind){
    if(HS){const other=findHost();if(other&&!other.isMe&&other.p.g.born<HS.born){HS=null;netSet({g:null});}}
    if(HS)hostTick(dt);
    hostE=findHost();GS=hostE?hostE.p.g:null;
    if(GS&&HS&&hostE.isMe)GS=Net.me.g;
    let want='lobby';if(GS){if(GS.ph==='awards')want='awards';else if(GS.ph==='hide'||GS.ph==='seek'||GS.ph==='over')want='play';}
    if(want==='play'){
      if(GS.rd!==lastRd){lastRd=GS.rd;lastEv=-1;startLocalRound();}
      if(screen!=='play'){show('play');if(!document.body.classList.contains('fs'))document.querySelector('#play .stage').scrollIntoView({behavior:'smooth',block:'center'});}
      processEvents();if(GS.pz){}else if(Lp)myTick(dt);else{if(pressed.left)obsIdx--;if(pressed.right)obsIdx++;}
      pubMe();smoothAll(dt);updFx(dt);render(dt);
    }else{
      if(Lp){Lp=null;netSet({me:null,act:null});}
      if(want==='awards'){if(screen!=='awards')show('awards');awardList=renderAwardsList();drawAwards(dt,awardList);}
      else{if(screen!=='lobby')show('lobby');renderLobby();drawLobbyCards(T);}
    }
  }
  if(galOpen){if(galFromGame&&(screen!=='play'||!Lp||(Lp.mode!=='free'&&Lp.mode!=='frozen')))closeGallery();else renderGallery();}
  if(infoOpen)drawInfoCanvas();
  if(anyModal())for(const k in pressed)pressed[k]=false;
  for(const k in pressed)pressed[k]=false;
  netFlush(ts);
  requestAnimationFrame(frame);
}

/* ================= Innstillinger, språk, avslutt ================= */
let setOpen=false;const tt=(...a)=>t(...a);
function setLang(l){LANG=l;try{localStorage.setItem('fk2_lang',JSON.stringify(l));}catch(e){}applyLang();galSig='';applyFs();muteBtn.textContent=muted?t('muted'):t('sound');
  document.getElementById('pagesLink').textContent=PAGES_URL;lobSig='';awardSig='';renderSettings();}
function renderSettings(){
  const ls=document.getElementById('langSet');ls.innerHTML='';const lb=document.createElement('span');lb.textContent=t('lang');ls.append(lb);
  [['nb','Norsk'],['zh','中文'],['en','English']].forEach(([k,lab])=>{const b=document.createElement('button');b.className='chip'+(LANG===k?' on':'');b.textContent=lab;b.onclick=()=>setLang(k);ls.append(b);});
  document.getElementById('sfxR').value=Math.round(SFXV*100);document.getElementById('voxR').value=Math.round(VOXV*100);
  const cn=document.getElementById('setCatName');if(document.activeElement!==cn)cn.value=myLob.cn||'';
  document.getElementById('setCatRow').style.display=Net.kind?'':'none';
  const hl=document.getElementById('hostLive');const live=!!HS;hl.style.display=live?'':'none';
  if(live){const mk=(id,label,vals,cur,lab,onp)=>{const el=document.getElementById(id);el.innerHTML='';const sp=document.createElement('span');sp.textContent=label;el.append(sp);
      vals.forEach(v=>{const b=document.createElement('button');b.className='chip'+(v===cur?' on':'');b.textContent=lab(v);b.onclick=()=>{onp(v);renderSettings();lobSig='';};el.append(b);});};
    mk('liveHint',t('hints'),[1,0],HS.hn?1:0,v=>v?t('on'):t('off'),v=>{HINTS=!!v;store.set('hints',HINTS);HS.hn=HINTS;});
    mk('liveDogs',t('dogs'),[0,1,2,3,4,5],HS.nd,v=>String(v),v=>{NDOGS=v;store.set('dogs',v);HS.nd=v;
      if(HS.ph==='hide'||HS.ph==='seek'){while(HS.dogs.length<v){const ds=randSpawn();HS.dogs.push({x:ds.x,y:floorY(ds.lv),lv:ds.lv,face:1,move:0,state:'wander',route:[],t:0,chaseT:0,calm:3,pause:0,speed:150,tw:null});}HS.dogs.length=Math.min(HS.dogs.length,v);}});
    const pb=document.getElementById('pauseBtn');const inRound=HS.ph==='hide'||HS.ph==='seek';pb.style.display=inRound?'':'none';pb.textContent=HS.pz?t('resume'):t('pause');
    pb.onclick=()=>{HS.pz=!HS.pz;renderSettings();};}
  document.getElementById('exitHost').style.display=(HS&&Net.kind&&Net.kind!=='solo')?'':'none';
}
function toggleSettings(force){setOpen=force==null?!setOpen:force;document.getElementById('setModal').classList.toggle('on',setOpen);document.getElementById('exitBox').style.display='none';
  for(const k in keys)keys[k]=false;if(setOpen)renderSettings();}
document.getElementById('setBtn').onclick=()=>toggleSettings(true);
document.getElementById('gearBtn').onclick=()=>toggleSettings(true);
document.getElementById('closeSet').onclick=()=>toggleSettings(false);
document.getElementById('setModal').addEventListener('click',e=>{if(e.target.id==='setModal')toggleSettings(false);});
document.getElementById('sfxR').oninput=e=>{SFXV=e.target.value/100;store.set('sfx',SFXV);};
document.getElementById('sfxR').onchange=()=>tone(880,.12,'triangle',.12);
document.getElementById('voxR').oninput=e=>{VOXV=e.target.value/100;store.set('vox',VOXV);};
document.getElementById('setCatName').oninput=e=>{myLob.cn=e.target.value;const ci=document.getElementById('catName');if(ci)ci.value=myLob.cn;if(Net.kind)pubLob();lobSig='';};
document.getElementById('catName').oninput=e=>{myLob.cn=e.target.value;if(Net.kind)pubLob();lobSig='';};
document.getElementById('catName').value=myLob.cn||'';
document.getElementById('exitBtn').onclick=()=>{if(!Net.kind){toggleSettings(false);return;}document.getElementById('exitBox').style.display='';};
document.getElementById('exitNo').onclick=()=>{document.getElementById('exitBox').style.display='none';};
document.getElementById('exitYes').onclick=()=>{try{netSet({g:null,me:null,lob:null,act:null});Net.send();}catch(e){}setTimeout(()=>location.reload(),150);};

/* ================= Berøring og fullskjerm ================= */
const COARSE=matchMedia('(pointer:coarse)').matches;
if(COARSE){const ph=document.getElementById('playHint');ph.dataset.i18n='touchHint';}
// Styrekryss: én tommel styrer både venstre og høyre – kan gli mellom knappene
(()=>{const pad=document.getElementById('dpad');const bl=pad.querySelector('[data-dir=left]'),br=pad.querySelector('[data-dir=right]');let pid=null;
  const setDir=d=>{for(const k of['left','right']){const want=d===k;if(want&&!keys[k])pressed[k]=true;keys[k]=want;}bl.classList.toggle('on',d==='left');br.classList.toggle('on',d==='right');};
  const dirAt=x=>{const r=pad.getBoundingClientRect();return x<r.left+r.width/2?'left':'right';};
  pad.addEventListener('pointerdown',e=>{e.preventDefault();ac();pid=e.pointerId;try{pad.setPointerCapture(pid);}catch(_){}setDir(dirAt(e.clientX));});
  pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)setDir(dirAt(e.clientX));});
  const end=e=>{if(e.pointerId!==pid)return;pid=null;setDir(null);};
  pad.addEventListener('pointerup',end);pad.addEventListener('pointercancel',end);pad.addEventListener('lostpointercapture',end);
  pad.addEventListener('contextmenu',e=>e.preventDefault());})();
const playEl=document.getElementById('play');
playEl.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>{if(screen==='play')e.preventDefault();});
playEl.addEventListener('touchmove',e=>{if(document.body.classList.contains('fs'))e.preventDefault();},{passive:false});
// fsUser: null = automatisk (mobil på tvers), true/false = valgt med knappen
let fsUser=null;
const nativeFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
const autoFs=()=>COARSE&&innerWidth>innerHeight&&innerHeight<600;
const FS_IN='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const FS_OUT='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
function fsActive(){return !!nativeFs()||(fsUser==null?autoFs():fsUser);}
function applyFs(){const on=fsActive();document.body.classList.toggle('fs',on&&screen==='play');
  const lab=on?t('fsOff'):t('fsOn');const top=document.getElementById('fsTop'),pb=document.getElementById('fsBtn');
  top.innerHTML=(on?FS_OUT:FS_IN)+'<span></span>';top.querySelector('span').textContent=lab;top.title=lab;
  pb.innerHTML=on?FS_OUT:FS_IN;pb.title=lab;pb.setAttribute('aria-label',lab);}
async function toggleFs(){ac();const on=fsActive();
  if(!on){fsUser=true;const el=document.documentElement;const rq=el.requestFullscreen||el.webkitRequestFullscreen;
    if(rq){try{await rq.call(el,{navigationUI:'hide'});}catch(e){}}
    try{const so=window.screen.orientation;if(so&&so.lock)await so.lock('landscape');}catch(e){}}
  else{fsUser=false;const ex=document.exitFullscreen||document.webkitExitFullscreen;if(nativeFs()&&ex){try{await ex.call(document);}catch(e){}}
    try{const so=window.screen.orientation;so&&so.unlock&&so.unlock();}catch(e){}}
  applyFs();}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(!nativeFs()&&fsUser===true)fsUser=false;applyFs();}));
addEventListener('resize',applyFs);addEventListener('orientationchange',()=>setTimeout(applyFs,250));
document.getElementById('fsBtn').onclick=toggleFs;document.getElementById('fsTop').onclick=toggleFs;
// Hold skjermen våken mens man spiller
let wakeLock=null;
async function syncWake(){const want=screen==='play'&&document.visibilityState==='visible';
  try{if(want&&!wakeLock&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}
    else if(!want&&wakeLock){await wakeLock.release();wakeLock=null;}}catch(e){wakeLock=null;}}
document.addEventListener('visibilitychange',syncWake);
